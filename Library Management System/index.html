
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Library Management System</h1>
        <p>Manage Books Easily</p>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#add">Add Book</a>
        <a href="#books">View Books</a>
    </nav>

    <section id="home">
        <h2>Welcome to Our Library</h2>
        <p>
            This system helps manage books, issue books
            to students, and record book returns.
        </p>
    </section>

    <section id="add">
        <h2>Add New Book</h2>

        <form id="bookForm">
            <label for="bookId">Book ID</label>
            <input type="text" id="bookId" required>

            <label for="title">Book Title</label>
            <input type="text" id="title" required>

            <label for="author">Author Name</label>
            <input type="text" id="author" required>

            <label for="quantity">Quantity</label>
            <input type="number" id="quantity"
                   min="1" step="1" required>

            <button type="submit">Add Book</button>
        </form>

        <p id="message"></p>
    </section>

    <section id="books">
        <h2>Library Books</h2>

        <label for="search">Search Books</label>
        <input type="text" id="search"
               placeholder="Enter title, author or book ID">

        <button type="button" id="searchButton">
            Search
        </button>

        <div id="bookList"></div>
    </section>

    <footer>
        <p>Cloud-Based Library Management System</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
